# nginx's settings for the Bounty Board.
server {
    # Listen on port 80, inside the container. compose.yaml publishes it as
    # port 9000 on your machine.
    listen 80;

    # Calls to an address starting with /api/, such as /api/bounties, go to the
    # API. "api" is the API's service name in compose.yaml: Compose's network
    # turns it into the API container's address. 8000 is the API's port.
    location /api/ {
        proxy_pass http://api:8000;
    }

    # Everything else is a file from the page's folder. Asking for / sends
    # index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
