# web: the web server. It sends your browser the page, and passes every call
# to an address starting with /api/ on to the api Service.

# The Deployment keeps two copies running. Like the API, nginx keeps no data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # Built from the Dockerfile in the web/ folder.
          image: bounty-board-web:1.0
          ports:
            - containerPort: 80
---
# The Service gives both copies one name, web, on port 80. To open it from
# your machine: kubectl port-forward -n bounty-board service/web 9000:80
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
