# api: a small Python app. It lists bounties and adds new ones, and answers
# in JSON.

# The Deployment keeps two copies running. The API keeps no data of its own,
# so any copy can answer any call.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Built from the Dockerfile in the api/ folder.
          image: bounty-board-api:1.0
          # Settings the app reads when it starts.
          env:
            # Where the database is: user bounty, its password, the Service db
            # on Postgres's port 5432, and the database called bounties.
            # A practice password, not a real secret.
            - name: DATABASE_URL
              value: "postgresql://bounty:not-a-real-secret@db:5432/bounties"
            # Where the cache is: the Service called cache.
            - name: REDIS_HOST
              value: cache
          ports:
            - containerPort: 8000
---
# The Service gives both copies one name, api, on port 8000. nginx's settings
# in web/default.conf call http://api:8000, so they work here unchanged.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
